version: '3'

vars:
  BINARY: coolbot-exporter
  BIN_DIR: bin

tasks:
  default:
    desc: Build the exporter
    cmds:
      - task: build

  build:
    desc: Build the binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.BINARY}} ./cmd/coolbot-exporter

  run:
    desc: Build and run the exporter
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}}

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  deps:
    desc: Tidy dependencies
    cmds:
      - go mod tidy

  docker:
    desc: Build Docker image
    cmds:
      - docker build -t coolbot-exporter .

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  dev:
    desc: Run with debug logging
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} -log-level debug
